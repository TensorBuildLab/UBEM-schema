[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubem-link"
version = "1.0.0"
description = "UBEM-Link: an AI-ready schema, open-data catalog and tool that turns building and urban energy data and their codebooks into checked, joinable UBEM inputs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); CC-BY-4.0 (schema, catalog, gold labels)"}
dependencies = [
  "pyyaml>=6",
  "pandas>=2",
  "openpyxl>=3.1",
  "jsonschema>=4",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "requests>=2.31",
]

[project.optional-dependencies]
schema = ["linkml>=1.8"]
llm = ["anthropic>=0.40"]
embed = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
ubem-link = "ubem_link.cli:main"

[project.urls]
Repository = "https://github.com/TensorBuildLab/UBEM-schema"
Documentation = "https://github.com/TensorBuildLab/UBEM-schema/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubem_link = ["_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
