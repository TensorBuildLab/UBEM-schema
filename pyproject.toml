[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-urban"
version = "2.0.0.dev0"
description = "Meta-Urban: metadata schema, open-data catalog and LLM alignment benchmark for urban building energy modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); CC-BY-4.0 (schema, catalog, gold labels)"}
dependencies = [
  "pyyaml>=6",
  "pandas>=2",
  "openpyxl>=3.1",
  "jsonschema>=4",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "requests>=2.31",
]

[project.optional-dependencies]
schema = ["linkml>=1.8"]
llm = ["anthropic>=0.40", "openai>=1.50"]
embed = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
