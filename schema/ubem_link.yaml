id: https://w3id.org/ubem-link/schema
name: ubem_link
title: UBEM-Link metadata schema for open data in urban building energy modeling
version: 1.0.0
description: >-
  UBEM-Link describes open datasets used in urban building energy modeling (UBEM) at two levels.
  The dataset level (DatasetProfile) is an application profile of W3C DCAT 3 with UBEM-specific facets:
  the UBEM workflow role, statistical nature, spatial granularity, temporal resolution, access level and
  join keys. The variable level (VariableProfile) records what each column means for UBEM: the concept it
  maps to in the UBEM-Link vocabulary, its unit (QUDT), its code list, its aggregation semantics, and
  whether it is a survey weight or an imputation flag. Concepts (UBEMConcept) form a SKOS hierarchy and
  carry mappings to BEDES, Brick, CityGML Energy ADE and EnergyPlus input objects. Between the two levels, one
  category profile per UBEM workflow role (WeatherProfile, GeometryProfile, OperationProfile,
  CharacteristicsProfile, EnergyProfile, SimulationProfile, ContextProfile) records what a modeler must know
  about that kind of data. The roles and category profiles refine an earlier seven-category taxonomy of open
  UBEM data (weather information; building stock GIS; occupant behavior; building characteristics;
  macroscopic energy; microscopic energy; comprehensive data lakes) and its per-category metadata table.
license: CC-BY-4.0
see_also:
  - https://github.com/TensorBuildLab/UBEM-schema
prefixes:
  linkml: https://w3id.org/linkml/
  ubem_link: https://w3id.org/ubem-link/
  dcat: http://www.w3.org/ns/dcat#
  dct: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  quantitykind: http://qudt.org/vocab/quantitykind/
  prov: http://www.w3.org/ns/prov#
  csvw: http://www.w3.org/ns/csvw#
  xsd: http://www.w3.org/2001/XMLSchema#
  brick: https://brickschema.org/schema/Brick#
  rec: https://w3id.org/rec#
  bedes: https://bedes.lbl.gov/node/
  energy: http://www.sig3d.org/citygml/2.0/energy/1.0#
default_prefix: ubem_link
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------------------------------------------------
classes:

  Catalog:
    description: A collection of dataset profiles and the concept vocabulary they refer to.
    class_uri: dcat:Catalog
    tree_root: true
    slots:
      - datasets
      - concepts

  DatasetProfile:
    description: >-
      Dataset-level description of one open dataset, sufficient to decide whether and how it can feed a UBEM
      workflow, and to join it with other datasets.
    class_uri: dcat:Dataset
    slots:
      - id
      - title
      - short_name
      - publisher
      - landing_page
      - doi
      - citation
      - reference_paper_doi
      - license
      - access_level
      - distributions
      - ubem_roles
      - content_types
      - geographic_scope
      - spatial_coverage
      - unit_of_observation
      - spatial_granularity
      - temporal_coverage
      - temporal_resolution
      - update_frequency
      - statistical_nature
      - sampling_weights
      - conventions
      - record_count
      - record_count_note
      - join_keys
      - variables_documented
      - machine_readable
      - versioned
      - persistent_identifier
      - known_limitations
      - notes
      - verified
      - weather_profile
      - geometry_profile
      - operation_profile
      - characteristics_profile
      - energy_profile
      - simulation_profile
      - context_profile
      - variables
    slot_usage:
      id:
        required: true
      title:
        required: true
      ubem_roles:
        required: true
      statistical_nature:
        required: true
      spatial_granularity:
        required: true
      access_level:
        required: true
    rules:
      - description: A weighted sample survey must name its weights.
        preconditions:
          slot_conditions:
            statistical_nature:
              equals_string: sample_survey_weighted
        postconditions:
          slot_conditions:
            sampling_weights:
              required: true

  Distribution:
    description: One way of obtaining the data.
    class_uri: dcat:Distribution
    slots:
      - format
      - access_url
      - api
      - registration_required

  SpatialCoverage:
    description: "Geographic area a dataset covers."
    class_uri: dct:Location
    slots:
      - countries
      - description
      - bbox

  TemporalCoverage:
    description: "Period of time a dataset covers."
    class_uri: dct:PeriodOfTime
    slots:
      - start
      - end

  Convention:
    description: >-
      A rule the publisher applies to many variables at once, such as a naming pattern for imputation flags, a
      code that means "not applicable", or a unit used for all energy totals. Conventions are usually stated
      once in a user guide and never in the individual codebook entries, so a person or an AI system reading
      one entry cannot infer them; the profile states them explicitly.
    slots:
      - convention_type
      - applies_to
      - applies_to_variables
      - applies_to_pattern
      - rule
      - example
      - missing_codes
      - unit
      - unit_multiplier
    slot_usage:
      rule:
        required: true

  Verification:
    description: Provenance of the profile itself (who checked it, when, against which sources).
    class_uri: prov:Activity
    slots:
      - date
      - by
      - sources_checked

  CategoryProfile:
    abstract: true
    description: >-
      Category-specific part of a dataset profile: what a modeler must know about one kind of UBEM data before
      using it. There is one profile class per UBEM workflow role. The classes refine the per-category metadata
      table of an earlier taxonomy of open UBEM data: its free-text fields became typed fields with closed value
      lists, its "macroscopic" and "microscopic" energy data share EnergyProfile and differ in energy_data_scale,
      and its "comprehensive data lake" is a Catalog of profiles rather than a category.
    slots:
      - provides_concepts
      - metadata_standards

  WeatherProfile:
    is_a: CategoryProfile
    description: >-
      Weather and climate data used as boundary conditions: observed station records, reanalyses, typical and
      actual meteorological years, and climate projections.
    slots:
      - weather_year_type
      - weather_file_format
      - timestamp_convention
      - time_basis
      - gap_filling
      - grid_resolution_km
      - station_id_scheme
      - climate_scenarios
    slot_usage:
      weather_year_type:
        required: true

  GeometryProfile:
    is_a: CategoryProfile
    description: >-
      Building stock geometry and inventory: footprints, heights, 3D city models and parcels.
    slots:
      - geometry_dimension
      - levels_of_detail
      - height_source
      - height_reference
      - coordinate_reference_system
      - crs_linear_unit
      - building_id_scheme
      - minimum_building_size
    slot_usage:
      geometry_dimension:
        required: true

  OperationProfile:
    is_a: CategoryProfile
    description: >-
      Occupancy, occupant behavior, schedules, setpoints and time use.
    slots:
      - behavior_types
      - control_actions
      - collection_method
      - building_sectors
    slot_usage:
      behavior_types:
        required: true

  CharacteristicsProfile:
    is_a: CategoryProfile
    description: >-
      Non-geometric building characteristics (use type, vintage, envelope, systems, fuels) from surveys,
      administrative records, certificates and dictionaries.
    slots:
      - data_form
      - building_sectors
      - representativeness
      - coverage_threshold
      - cross_tabulations
    slot_usage:
      data_form:
        required: true

  EnergyProfile:
    is_a: CategoryProfile
    description: >-
      Measured or reported energy use for calibration and validation, from national balances (macroscopic) to
      buildings, meters and appliances (microscopic).
    slots:
      - energy_data_scale
      - energy_sectors
      - energy_carriers
      - energy_metrics
      - metering_level
      - measurement_basis
      - weather_normalized_available
      - reporting_period
    slot_usage:
      energy_data_scale:
        required: true

  SimulationProfile:
    is_a: CategoryProfile
    description: >-
      Reference simulations and model libraries: synthetic building-stock outputs and prototype models.
    slots:
      - simulation_engine
      - stock_representation
      - weather_basis
      - building_sectors

  ContextProfile:
    is_a: CategoryProfile
    description: >-
      Context and coupling data: socio-economic data, land use, grid emissions, tariffs and urban climate.
    slots:
      - context_kind

  VariableProfile:
    description: >-
      Variable-level (column-level) semantics. One VariableProfile per column of a tabular dataset, or per
      variable of a gridded dataset.
    class_uri: csvw:Column
    slots:
      - name
      - label
      - description
      - datatype
      - concept
      - mapping_relation
      - unit
      - unit_multiplier
      - aggregation
      - entity
      - code_list
      - missing_codes
      - is_weight
      - is_replicate_weight
      - is_imputation_flag
      - flags_variable
      - join_key
      - do_not_use
      - profiled_by
      - confidence
      - review_flags
    slot_usage:
      name:
        required: true

  CodeEntry:
    description: One code of a categorical variable and its meaning.
    class_uri: skos:Concept
    slots:
      - code
      - label
      - concept_value

  UBEMConcept:
    description: >-
      A concept in the UBEM-Link vocabulary: a quantity or attribute that a UBEM workflow consumes or
      produces (for example floor area, principal building activity, dry-bulb temperature, annual electricity
      use). Concepts form a hierarchy through `broader` and point to equivalent terms in other standards.
    class_uri: skos:Concept
    slots:
      - id
      - pref_label
      - definition
      - alt_labels
      - broader
      - concept_role
      - entity
      - quantity_kind
      - canonical_unit
      - exact_match
      - close_match
      - broad_match
      - narrow_match
      - related_match
    slot_usage:
      id:
        required: true
      pref_label:
        required: true
      definition:
        required: true

# ---------------------------------------------------------------------------------------------------------
slots:

  # catalog
  datasets:
    description: "Dataset profiles held in the catalog."
    range: DatasetProfile
    multivalued: true
    inlined_as_list: true
  concepts:
    description: "Concepts of the vocabulary held in the catalog."
    range: UBEMConcept
    multivalued: true
    inlined_as_list: true

  # identification
  id:
    description: "Stable lowercase identifier of the record (letters, digits, '_', '.', '-')."
    identifier: true
    range: string
    pattern: "^[a-z0-9][a-z0-9_.-]*$"
  title:
    description: "Full title of the dataset as given by its publisher."
    slot_uri: dct:title
  short_name:
    description: "Common short name or acronym of the dataset (for example CBECS 2018)."
    slot_uri: skos:altLabel
  publisher:
    description: "Organization that publishes and maintains the dataset."
    slot_uri: dct:publisher
  landing_page:
    description: "Web page of the dataset maintained by the publisher."
    slot_uri: dcat:landingPage
    range: uri
  doi:
    description: DOI of the dataset itself (bare form, e.g. 10.1234/abc).
    pattern: "^10\\.\\d{4,9}/\\S+$"
  citation:
    description: "Citation text the publisher asks users to give."
    slot_uri: dct:bibliographicCitation
  reference_paper_doi:
    description: DOI of a peer-reviewed paper that describes the dataset.
    pattern: "^10\\.\\d{4,9}/\\S+$"
  license:
    description: "License or terms of use, as stated by the publisher (SPDX identifier where one exists)."
    slot_uri: dct:license
  access_level:
    description: "How the data can be obtained, from open download to restricted or commercial access."
    range: AccessLevel
  distributions:
    description: "The downloadable files or services through which the data are released."
    slot_uri: dcat:distribution
    range: Distribution
    multivalued: true
    inlined_as_list: true
  format:
    description: "File format or media type of a distribution (for example CSV, GeoParquet, NetCDF)."
    slot_uri: dct:format
  access_url:
    description: "URL from which a distribution can be accessed or downloaded."
    slot_uri: dcat:accessURL
  api:
    description: "True if the distribution is a programmatic interface (API or web service) rather than a file."
    range: boolean
  registration_required:
    description: "True if users must register or sign in before downloading."
    range: boolean

  conventions:
    description: "Dataset-wide rules for naming, coding and units that apply to many variables."
    range: Convention
    multivalued: true
    inlined_as_list: true
  applies_to:
    description: "Which variables the convention applies to (a name pattern or a description)."
  rule:
    description: "The convention, stated as a rule that can be applied without other context."
  example:
    description: "One concrete example of the rule from the dataset."

  # facets
  ubem_roles:
    description: UBEM workflow steps the dataset feeds; first value is the primary role.
    range: UBEMRole
    multivalued: true
  content_types:
    description: "Kinds of content in the dataset (for example footprints, microdata, hourly loads)."
    multivalued: true
    slot_uri: dcat:theme
  geographic_scope:
    description: "Extent of the area covered, from city to global."
    range: GeographicScope
  spatial_coverage:
    description: "Area the dataset covers, as countries and optional regions."
    slot_uri: dct:spatial
    range: SpatialCoverage
    inlined: true
  countries:
    description: ISO 3166-1 alpha-2 codes, or GLOBAL.
    multivalued: true
    pattern: "^([A-Z]{2}|GLOBAL|EU)$"
  bbox:
    description: WGS84 bounding box "minLon,minLat,maxLon,maxLat" when meaningful.
    slot_uri: dcat:bbox
  unit_of_observation:
    description: What one record describes (building, meter, household, station, grid_cell, region, person_day, ...).
  spatial_granularity:
    description: Finest location detail released publicly.
    range: SpatialGranularity
  temporal_coverage:
    description: "Period the data describe."
    slot_uri: dct:temporal
    range: TemporalCoverage
    inlined: true
  start:
    description: "First period covered (ISO 8601 year, month or date)."
    slot_uri: dcat:startDate
  end:
    description: "Last period covered (ISO 8601), or 'present' for an ongoing series."
    slot_uri: dcat:endDate
  temporal_resolution:
    description: ISO 8601 duration of the finest time step, or "static" or "irregular".
    slot_uri: dcat:temporalResolution
    pattern: "^(P(?!$)(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(?=\\d)(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?|static|irregular)$"
  update_frequency:
    description: "How often the publisher releases new data (for example annual, irregular)."
    slot_uri: dct:accrualPeriodicity
  statistical_nature:
    description: "How the data were generated, which decides how they may be analyzed (for example a weighted sample survey must be analyzed with its weights)."
    range: StatisticalNature
  sampling_weights:
    description: Weight variables and how to use them (required for weighted sample surveys).
  record_count:
    description: "Number of records (rows, buildings, meters or stations) in the dataset."
    range: integer
  record_count_note:
    description: "What the record count counts and its source."
  join_keys:
    description: "Keys present in the public data that allow records to be linked to other datasets."
    range: JoinKey
    multivalued: true
  variables_documented:
    description: "True if the publisher documents every variable (codebook or data dictionary)."
    range: boolean
  machine_readable:
    description: "True if the data are released in a machine-readable format, not only as reports."
    range: boolean
  versioned:
    description: "True if the publisher identifies releases with versions."
    range: boolean
  persistent_identifier:
    description: "True if the dataset has a persistent identifier such as a DOI."
    range: boolean
  known_limitations:
    description: "Limitations a user must know before using the data (bias, coverage gaps, suppression)."
  notes:
    description: "Other information about the dataset or about how its profile was verified."
  verified:
    description: "Provenance of the profile: who checked it, when and against which sources."
    slot_uri: prov:wasGeneratedBy
    range: Verification
    inlined: true
  date:
    description: "Date of the verification (ISO 8601)."
  by:
    description: "Person or agent who carried out the verification."
  sources_checked:
    description: "Pages and documents consulted during verification."
    range: uri
    multivalued: true
  variables:
    description: "Variable-level profiles of the dataset's columns."
    range: VariableProfile
    multivalued: true
    inlined_as_list: true

  # category profiles (one per UBEM workflow role)
  weather_profile:
    description: "Category profile for a dataset with the role boundary_conditions."
    range: WeatherProfile
    inlined: true
  geometry_profile:
    description: "Category profile for a dataset with the role geometry_inventory."
    range: GeometryProfile
    inlined: true
  operation_profile:
    description: "Category profile for a dataset with the role operation_use."
    range: OperationProfile
    inlined: true
  characteristics_profile:
    description: "Category profile for a dataset with the role building_characteristics."
    range: CharacteristicsProfile
    inlined: true
  energy_profile:
    description: "Category profile for a dataset with the role calibration_validation."
    range: EnergyProfile
    inlined: true
  simulation_profile:
    description: "Category profile for a dataset with the role reference_simulation."
    range: SimulationProfile
    inlined: true
  context_profile:
    description: "Category profile for a dataset with the role context_coupling."
    range: ContextProfile
    inlined: true
  provides_concepts:
    description: "Ids of the UBEM-Link concepts the dataset provides values for (its content at concept level)."
    multivalued: true
  metadata_standards:
    description: "Metadata standards or schemas the publisher already uses (for example Brick, BuildingSync, DDI-Codebook, CityGML)."
    multivalued: true
  weather_year_type:
    description: "Kind of weather year or series: actual series, actual or typical meteorological year, normals, or projection."
    range: WeatherYearType
    multivalued: true
  weather_file_format:
    description: "Formats in which weather is released, which decide whether a simulation engine can read it directly."
    range: WeatherFileFormat
    multivalued: true
  timestamp_convention:
    description: "Whether a timestamp marks the end, the start or the instant of the interval it describes."
    range: TimestampConvention
  time_basis:
    description: "Clock to which timestamps refer (UTC, local standard time, or local time with daylight saving)."
    range: TimeBasis
  gap_filling:
    description: "How missing or sub-interval values were filled by the publisher."
    range: GapFilling
  grid_resolution_km:
    description: "Horizontal resolution of a gridded product in kilometres."
    range: float
  station_id_scheme:
    description: "Identifier system of the stations (for example WMO, USAF-WBAN, GHCN)."
  climate_scenarios:
    description: "Emission or socio-economic scenarios of a projection (for example SSP2-4.5, RCP8.5)."
    multivalued: true
  geometry_dimension:
    description: "Geometric representation of buildings, from points and footprints to 3D solids."
    range: GeometryDimension
  levels_of_detail:
    description: "CityGML levels of detail provided."
    range: LevelOfDetail
    multivalued: true
  height_source:
    description: "How building heights were obtained."
    range: HeightSource
    multivalued: true
  height_reference:
    description: "Reference points between which a building height is measured."
    range: HeightReference
  coordinate_reference_system:
    description: "Coordinate reference system of the published geometry, as an EPSG code (for example EPSG:4326)."
    pattern: "^EPSG:[0-9]+$"
  crs_linear_unit:
    description: "Linear unit of the coordinate reference system and of lengths and areas derived from it (QUDT CURIE, for example unit:FT_US or unit:M)."
  building_id_scheme:
    description: "Building identifier system used (for example BIN, UPRN, BAG, UBID); null if none."
  minimum_building_size:
    description: "Capture threshold for buildings, as stated by the publisher (for example 'larger than 400 sq ft')."
  behavior_types:
    description: "Kinds of occupant behavior or building operation recorded."
    range: BehaviorType
    multivalued: true
  control_actions:
    description: "Occupant control actions recorded."
    range: ControlAction
    multivalued: true
  collection_method:
    description: "How the behavior or operation data were collected."
    range: CollectionMethod
    multivalued: true
  building_sectors:
    description: "Building sectors covered."
    range: BuildingSector
    multivalued: true
  data_form:
    description: "Whether the data are records of individual units (microdata or building records) or published distributions (aggregate tables)."
    range: DataForm
    multivalued: true
  representativeness:
    description: "How the covered buildings relate to the building stock, which decides whether results generalize."
    range: Representativeness
  coverage_threshold:
    description: "Size or other threshold that decides which buildings are covered (for example 'more than 25,000 ft²')."
  cross_tabulations:
    description: "For aggregate tables, the joint distributions published, each as concept ids joined by ' x '."
    multivalued: true
  energy_data_scale:
    description: "Macroscopic (aggregates over many buildings) or microscopic (buildings, meters, circuits or appliances)."
    range: EnergyDataScale
  energy_sectors:
    description: "Energy-using sectors covered."
    range: EnergySector
    multivalued: true
  energy_carriers:
    description: "Energy carriers reported."
    range: EnergyCarrier
    multivalued: true
  energy_metrics:
    description: "Kinds of energy quantity reported."
    range: EnergyMetric
    multivalued: true
  metering_level:
    description: "Finest level at which energy is measured or reported."
    range: MeteringLevel
  measurement_basis:
    description: "Whether values are metered, billed, self-reported or modeled."
    range: MeasurementBasis
  weather_normalized_available:
    description: "True if weather-normalized values are published alongside the actual ones."
    range: boolean
  reporting_period:
    description: "Period one value covers (for example calendar year, billing month)."
  simulation_engine:
    description: "Simulation engine that produced the data (for example EnergyPlus)."
  stock_representation:
    description: "How the simulated building stock is represented."
    range: StockRepresentation
  weather_basis:
    description: "Weather used for the simulations (for example AMY 2018, TMY3)."
  context_kind:
    description: "Kind of context or coupling data."
    range: ContextKind
    multivalued: true
  convention_type:
    description: "What the convention concerns, so that tools can apply it (missing codes, units, flags, keys)."
    range: ConventionType
  applies_to_variables:
    description: "Exact names of the variables a convention applies to (machine-readable scope)."
    multivalued: true
  applies_to_pattern:
    description: "Regular expression over variable names giving the variables a convention applies to (machine-readable scope)."

  # variable level
  name:
    description: "Variable name exactly as it appears in the data file."
    slot_uri: csvw:name
  label:
    description: "Short human-readable label of the variable as given in the codebook."
    slot_uri: skos:prefLabel
  description:
    description: "Longer description of the variable, such as the question text."
    slot_uri: dct:description
  datatype:
    description: "Data type of the variable's values."
    range: VariableDatatype
  concept:
    description: Id of the UBEMConcept this variable maps to, or "none".
    slot_uri: skos:related
  mapping_relation:
    description: "SKOS relation between the variable and its concept (exact, close, broad, narrow, related)."
    range: MappingRelation
  unit:
    description: QUDT unit CURIE, e.g. unit:FT2, unit:KiloBTU_IT, unit:KiloW-HR, unit:DEG_C.
    slot_uri: qudt:unit
  unit_multiplier:
    description: Factor applied to raw values before the unit applies (e.g., 1000 for "thousand Btu").
    range: float
  aggregation:
    description: "How each value relates to time: static, instantaneous, total or average over a period, count or share."
    range: Aggregation
  entity:
    description: "What the variable or concept describes (building, household, system, meter, region, ...)."
    range: EntityType
  code_list:
    description: "Codes of a categorical variable with their meanings."
    range: CodeEntry
    multivalued: true
    inlined_as_list: true
  code:
    description: "A value as stored in the data."
  concept_value:
    description: Optional normalized value in the target concept (e.g., an ASHRAE climate zone id).
  missing_codes:
    description: Raw values that mean missing, not applicable, or suppressed.
    multivalued: true
  is_weight:
    description: "True if the variable is a sampling or analysis weight; such variables are not observations."
    range: boolean
  is_imputation_flag:
    description: "True if the variable records whether another variable was imputed."
    range: boolean
  flags_variable:
    description: For an imputation or quality flag, the variable it refers to.
  is_replicate_weight:
    description: "True if the variable is a replicate weight used to estimate sampling variance."
    range: boolean
  join_key:
    description: "Key type the variable holds, if it can link records to other datasets (for example parcel_id for a tax-lot number)."
    range: JoinKey
  do_not_use:
    description: "True if the publisher says the variable must not be used (the reason is in a convention)."
    range: boolean
  profiled_by:
    description: "Who or what produced this variable profile (a person, or a model id such as ollama:qwen3:8b), and whether it was reviewed."
  confidence:
    description: "Confidence of an automatically produced mapping, between 0 and 1."
    range: float
  review_flags:
    description: "Reasons this profile should be reviewed by a person (failed checks, low confidence, disagreement)."
    multivalued: true

  # vocabulary
  pref_label:
    description: "Preferred human-readable label of the concept."
    slot_uri: skos:prefLabel
  definition:
    description: "What the concept means, written so that a person or an AI system can apply it without other context."
    slot_uri: skos:definition
  alt_labels:
    description: "Generic synonyms of the concept."
    slot_uri: skos:altLabel
    multivalued: true
  broader:
    description: "The more general concept in the hierarchy (SKOS broader)."
    slot_uri: skos:broader
    range: UBEMConcept
  concept_role:
    description: "UBEM workflow role the concept belongs to."
    range: UBEMRole
  quantity_kind:
    description: QUDT quantity kind CURIE, e.g. quantitykind:Area.
    slot_uri: qudt:hasQuantityKind
  canonical_unit:
    description: SI (or SI-accepted) unit in which normalized values are expressed.
  exact_match:
    description: "Term in another standard with the same meaning (SKOS exactMatch)."
    slot_uri: skos:exactMatch
    multivalued: true
  close_match:
    description: "Term in another standard with nearly the same meaning (SKOS closeMatch)."
    slot_uri: skos:closeMatch
    multivalued: true
  related_match:
    description: "Term in another standard that is associated but not equivalent (SKOS relatedMatch)."
    slot_uri: skos:relatedMatch
    multivalued: true
  broad_match:
    description: "Term in another standard that is more general (SKOS broadMatch)."
    slot_uri: skos:broadMatch
    multivalued: true
  narrow_match:
    description: "Term in another standard that is more specific (SKOS narrowMatch)."
    slot_uri: skos:narrowMatch
    multivalued: true

# ---------------------------------------------------------------------------------------------------------
enums:

  UBEMRole:
    description: The UBEM workflow step a dataset or concept serves.
    permissible_values:
      boundary_conditions:
        description: Weather and climate drivers (observed, reanalysis, typical-year, projections).
      geometry_inventory:
        description: Location and shape of buildings (footprints, heights, 3D models, parcels).
      building_characteristics:
        description: Non-geometric attributes (use type, vintage, envelope, systems, fuels, floor area).
      operation_use:
        description: Occupancy, schedules, occupant behavior, setpoints, plug loads.
      calibration_validation:
        description: Measured or reported energy use at any scale.
      reference_simulation:
        description: Synthetic building-stock model outputs and model libraries.
      context_coupling:
        description: Socio-economic, land use, grid emissions, tariffs, urban microclimate.

  GeographicScope:
    description: "Extent of the area a dataset covers."
    permissible_values:
      global: {description: "Covers (nearly) the whole world."}
      multinational: {description: "Covers several countries, such as the European Union."}
      national: {description: "Covers one country."}
      subnational: {description: "Covers part of a country, such as a state, province or utility territory."}
      city: {description: "Covers one city or metropolitan area."}

  SpatialGranularity:
    description: Ordered from finest to coarsest (see `rank` annotation).
    permissible_values:
      point_station: {description: "Individual measurement points such as weather stations.", annotations: {rank: 1}}
      building: {description: "Individual buildings or footprints.", annotations: {rank: 1}}
      parcel: {description: "Individual land parcels or lots.", annotations: {rank: 2}}
      grid_cell_fine: {description: "Raster or model grid cells of 1 km or finer.", annotations: {rank: 3}}
      census_block_group: {description: "U.S. census block groups (about 600 to 3,000 people).", annotations: {rank: 4}}
      census_tract: {description: "U.S. census tracts (about 4,000 people).", annotations: {rank: 5}}
      postal_code: {description: "Postal or ZIP codes.", annotations: {rank: 5}}
      grid_cell_coarse: {description: "Raster or model grid cells coarser than 1 km.", annotations: {rank: 6}}
      county: {description: "Counties or equivalent second-level administrative units.", annotations: {rank: 7}}
      city: {description: "Cities or municipalities.", annotations: {rank: 7}}
      utility_service_territory: {description: "Service territories of electric or gas utilities.", annotations: {rank: 8}}
      state_province: {description: "States, provinces or equivalent first-level administrative units.", annotations: {rank: 9}}
      climate_zone: {description: "Climate zones (for example ASHRAE or IECC zones).", annotations: {rank: 10}}
      census_region_division: {description: "U.S. census regions or divisions.", annotations: {rank: 10}}
      nation: {description: "Whole countries, with no finer location.", annotations: {rank: 11}}
      none: {description: "No location released", annotations: {rank: 12}}
      unknown: {description: "Could not be verified from public documentation", annotations: {rank: 99}}

  StatisticalNature:
    description: "How the data were generated; decides the statistical treatment they need."
    permissible_values:
      census_complete: {description: "Complete enumeration of a population."}
      sample_survey_weighted: {description: "Probability sample; estimates need weights."}
      administrative_record: {description: "Records created by an administrative process (certificates, permits, disclosure, utility filings)."}
      measured_monitoring: {description: "Sensor or meter measurements."}
      remote_sensing_derived: {description: "Derived from satellite, aerial or lidar data with a model."}
      crowdsourced: {description: "Volunteered geographic information."}
      reanalysis_model: {description: "Model-data assimilation product."}
      typical_year_synthetic: {description: "Typical meteorological year assembled from observations."}
      climate_projection: {description: "Output of climate models under scenarios."}
      simulation_synthetic: {description: "Output of building energy simulation."}
      standard_or_code: {description: "A standard, dictionary, code or reference model rather than observations."}
      compilation: {description: "Assembled from several of the above."}

  AccessLevel:
    description: "How the data can be obtained."
    permissible_values:
      open_download: {description: "Files can be downloaded by anyone without registration."}
      open_api: {description: "Data can be retrieved by anyone through an open programmatic interface."}
      registration_required: {description: "Free, but users must register or sign in."}
      request_or_agreement: {description: "Access requires an application, a data-use agreement or approval."}
      restricted_commercial: {description: "Access requires payment or is restricted to specific users."}

  JoinKey:
    description: "Keys in the public data through which records can be linked to other datasets."
    permissible_values:
      lat_lon: {description: "Latitude and longitude of the record."}
      geometry: {description: "A point, line or polygon geometry of the record."}
      address: {description: "Street address of the building or site."}
      parcel_id: {description: "Cadastral parcel or lot identifier shared with other datasets (for example BBL)."}
      building_id: {description: "Building identifier shared with other datasets (for example BIN, UPRN); not a dataset-internal row id."}
      ubid: {description: "Unique Building Identifier derived from the footprint."}
      station_id: {description: "Identifier of a weather or measurement station (for example WMO or USAF id)."}
      grid_cell: {description: "Identifier or coordinates of a raster or grid cell."}
      census_block_group: {description: "U.S. census block group code."}
      census_tract: {description: "U.S. census tract code."}
      small_statistical_area: {description: "Non-U.S. small statistical areas such as UK LSOA/MSOA or national census grid ids"}
      postal_code: {description: "Postal or ZIP code."}
      fips_county: {description: "U.S. FIPS county code."}
      fips_state: {description: "U.S. FIPS state code."}
      census_region_division: {description: "U.S. census region or division code."}
      nuts_region: {description: "European NUTS region code."}
      country_iso: {description: "ISO 3166 country code."}
      utility_id: {description: "Identifier of an electric or gas utility (for example EIA utility id)."}
      balancing_authority: {description: "Identifier of an electricity balancing authority."}
      climate_zone_ashrae: {description: "ASHRAE Standard 169 climate zone."}
      climate_zone_iecc: {description: "IECC climate zone."}
      building_type: {description: "Building type or use class (attribute key for statistical matching only)."}
      vintage: {description: "Construction period (attribute key for statistical matching only)."}
      timestamp: {description: "Date and time of an observation."}

  VariableDatatype:
    description: "Data type of a variable's values."
    permissible_values:
      integer: {description: "Whole numbers, such as counts or years."}
      float: {description: "Real numbers that may have decimals."}
      string: {description: "Free text without a code list."}
      categorical: {description: "Codes from a fixed list (see code_list)."}
      boolean: {description: "True or false."}
      datetime: {description: "Dates or date-times (ISO 8601)."}
      geometry: {description: "Spatial geometries such as points, lines or polygons."}
      identifier: {description: "Identifiers of records or entities."}

  MappingRelation:
    description: "SKOS mapping relation between a variable and a concept."
    permissible_values:
      exactMatch: {description: "The variable measures exactly the concept.", meaning: skos:exactMatch}
      closeMatch: {description: "The variable measures nearly the concept and can be used in its place in most applications.", meaning: skos:closeMatch}
      broadMatch: {description: "The concept is more general than the variable.", meaning: skos:broadMatch}
      narrowMatch: {description: "The concept is more specific than the variable.", meaning: skos:narrowMatch}
      relatedMatch: {description: "The variable is associated with the concept but does not measure it.", meaning: skos:relatedMatch}

  Aggregation:
    description: How a value relates to time.
    permissible_values:
      static: {description: "Attribute that does not vary in the observation period."}
      instantaneous: {description: "Value at a point in time (for example a temperature reading)."}
      total_over_period: {description: "Sum over the reporting period (for example annual energy use)."}
      average_over_period: {description: "Mean over the reporting period."}
      count: {description: "Number of items (for example number of floors or occupants)."}
      share: {description: "Fraction or percentage of a whole."}

  EntityType:
    description: What a concept or variable describes.
    permissible_values:
      site: {description: "A property or campus that may contain several buildings."}
      building: {description: "A single building."}
      zone: {description: "A thermal zone or space within a building."}
      system: {description: "A building system or piece of equipment (HVAC, water heating, lighting, ...)."}
      envelope: {description: "Walls, roofs, windows and other parts of the building envelope."}
      household: {description: "A household occupying a housing unit."}
      occupant: {description: "A person using a building."}
      meter: {description: "An energy or water meter."}
      region: {description: "A geographic area."}
      weather_station: {description: "A weather or climate observation station."}
      grid_cell: {description: "A cell of a raster or model grid."}
      dataset_record: {description: "Record bookkeeping (identifiers, weights, flags)."}

  WeatherYearType:
    description: "Kind of weather year or weather series."
    permissible_values:
      actual_series: {description: "Observed or reanalysis time series of actual weather over one or more years."}
      actual_meteorological_year: {description: "Simulation-ready file of one actual year (AMY)."}
      typical_meteorological_year: {description: "Typical year assembled from months of several years (TMY, TMYx, IWEC)."}
      climate_normals: {description: "Long-term averages such as 30-year normals."}
      future_typical_year: {description: "Typical year for a future period, morphed or downscaled from climate models."}
      projection_series: {description: "Time series from climate model projections."}
      design_conditions: {description: "Design-day statistics for sizing equipment."}

  WeatherFileFormat:
    description: "Format of released weather data."
    permissible_values:
      epw: {description: "EnergyPlus weather file, readable by most simulation engines."}
      tmy3_csv: {description: "TMY3 comma-separated format."}
      netcdf: {description: "NetCDF gridded files."}
      grib: {description: "GRIB gridded files."}
      csv: {description: "Other tabular text files."}
      api_json: {description: "Responses of a web API in JSON."}
      other: {description: "Other format."}

  TimestampConvention:
    description: "What a timestamp marks within its interval."
    permissible_values:
      interval_ending: {description: "The timestamp is the end of the interval (EPW hour 1 covers 00:00 to 01:00)."}
      interval_beginning: {description: "The timestamp is the start of the interval."}
      instantaneous: {description: "The value was observed at the timestamp."}
      unknown: {description: "Not stated by the publisher."}

  TimeBasis:
    description: "Clock to which timestamps refer."
    permissible_values:
      utc: {description: "Coordinated Universal Time."}
      local_standard_time: {description: "Local standard time without daylight saving (as in EPW files)."}
      local_time_with_dst: {description: "Local civil time including daylight saving."}
      unknown: {description: "Not stated by the publisher."}

  GapFilling:
    description: "How missing or sub-interval values were filled."
    permissible_values:
      none: {description: "Gaps are left as missing values."}
      linear_interpolation: {description: "Gaps filled by linear interpolation in time."}
      model_based: {description: "Gaps filled from a model, reanalysis or neighboring stations."}
      unknown: {description: "Not stated by the publisher."}

  GeometryDimension:
    description: "Geometric representation of buildings."
    permissible_values:
      point: {description: "Building locations as points only."}
      footprint_2d: {description: "Building outlines without height."}
      footprint_with_height: {description: "Building outlines with a height attribute (2.5D, extrudable to CityGML LoD1)."}
      solid_3d: {description: "Three-dimensional building solids or surfaces (CityGML LoD1 or higher)."}
      raster: {description: "Gridded built-up surface, volume or height."}
      parcel_polygon: {description: "Parcel or lot outlines, not buildings."}

  LevelOfDetail:
    description: "CityGML level of detail."
    permissible_values:
      lod0: {description: "Footprint or roof-edge polygon."}
      lod1: {description: "Block model: footprint extruded to one height."}
      lod2: {description: "Roof shapes and wall surfaces."}
      lod3: {description: "Architectural model with openings such as windows and doors."}
      lod4: {description: "Interior structures (CityGML 2.0 only)."}

  HeightSource:
    description: "How building heights were obtained."
    permissible_values:
      lidar: {description: "Measured from airborne laser scanning."}
      photogrammetry: {description: "Measured from stereo or oblique imagery."}
      plans_or_records: {description: "Taken from building plans or administrative records."}
      model_estimated: {description: "Estimated by a statistical or machine-learning model."}
      derived_from_floors: {description: "Computed from the number of floors and an assumed floor height."}
      none: {description: "No heights."}

  HeightReference:
    description: "Reference points of a building height."
    permissible_values:
      ground_to_roof_top: {description: "From ground level to the highest point of the roof."}
      ground_to_eave: {description: "From ground level to the eave."}
      ground_to_mean_roof: {description: "From ground level to the mean roof height."}
      above_sea_level: {description: "Elevation above a vertical datum, not a building height."}
      unknown: {description: "Not stated by the publisher."}

  BehaviorType:
    description: "Kind of occupant behavior or building operation."
    permissible_values:
      occupancy_presence: {description: "Whether or how many people are present."}
      hvac_operation: {description: "Operation of heating, cooling or ventilation."}
      thermostat_setpoint: {description: "Setpoints and their changes."}
      window_operation: {description: "Opening and closing windows."}
      lighting_operation: {description: "Switching or dimming lights."}
      appliance_plug_loads: {description: "Use of appliances and plug loads."}
      hot_water_use: {description: "Domestic hot water draws."}
      thermal_comfort: {description: "Thermal sensation, preference or acceptability votes."}
      time_use_activities: {description: "Activities of people over the day (time-use diaries)."}
      mobility: {description: "Travel and location over the day."}

  ControlAction:
    description: "Occupant control action."
    permissible_values:
      thermostat_adjustment: {description: "Changing a thermostat setpoint."}
      hvac_on_off: {description: "Switching heating, cooling or fans."}
      lighting_on_off: {description: "Switching or dimming lights."}
      window_open_close: {description: "Opening or closing a window."}
      shading_adjustment: {description: "Moving blinds or shades."}
      appliance_on_off: {description: "Switching an appliance."}

  CollectionMethod:
    description: "How behavior or operation data were collected."
    permissible_values:
      sensors_or_logs: {description: "Sensors, building automation logs or meters."}
      connected_devices: {description: "Smart thermostats or other connected devices."}
      survey_or_diary: {description: "Questionnaires or time-use diaries."}
      field_study_compilation: {description: "Compilation of separate field studies."}
      mobile_location: {description: "Mobile phone or other location traces."}

  BuildingSector:
    description: "Building sector."
    permissible_values:
      residential: {description: "Dwellings and residential buildings."}
      commercial: {description: "Commercial, public and institutional buildings."}
      industrial: {description: "Industrial buildings."}
      all: {description: "All building sectors."}

  DataForm:
    description: "Form in which characteristics are released."
    permissible_values:
      microdata: {description: "One record per sampled unit (building or household), usually with weights."}
      building_records: {description: "One record per identified real building or property (certificates, benchmarking, permits)."}
      aggregate_tables: {description: "Published distributions or totals, not records of units."}
      dictionary_or_standard: {description: "A data dictionary, standard or exchange schema, not data."}
      archetype_library: {description: "Typical buildings or model templates by type and vintage."}

  Representativeness:
    description: "How the covered buildings relate to the building stock."
    permissible_values:
      probability_sample: {description: "A probability sample; weighted estimates represent the stock."}
      complete_population: {description: "All buildings of the area."}
      mandated_subset: {description: "Buildings covered by a mandate (for example above a size threshold)."}
      voluntary_or_convenience: {description: "Buildings that chose to participate or were available."}
      synthetic: {description: "Modeled or typical buildings, not real ones."}
      unknown: {description: "Not stated by the publisher."}

  EnergyDataScale:
    description: "Scale of energy data."
    permissible_values:
      macroscopic: {description: "Aggregates over many buildings (national, state, utility or area totals)."}
      microscopic: {description: "Individual buildings, meters, circuits or appliances."}

  EnergySector:
    description: "Energy-using sector."
    permissible_values:
      residential: {description: "Households and residential buildings."}
      commercial: {description: "Commercial and public buildings."}
      industrial: {description: "Industry."}
      transportation: {description: "Transportation."}
      all: {description: "All sectors or the whole economy."}

  EnergyCarrier:
    description: "Energy carrier."
    permissible_values:
      electricity: {description: "Electricity."}
      natural_gas: {description: "Natural gas."}
      fuel_oil: {description: "Fuel oil and other petroleum liquids."}
      propane: {description: "Propane and liquefied petroleum gas."}
      district_energy: {description: "District steam, hot water or chilled water."}
      biomass: {description: "Wood and other biomass."}
      onsite_renewables: {description: "Energy generated on site, such as rooftop solar."}
      all_carriers: {description: "Totals over all carriers only."}

  EnergyMetric:
    description: "Kind of energy quantity."
    permissible_values:
      site_energy: {description: "Energy delivered to the site."}
      source_energy: {description: "Site energy plus upstream generation and delivery losses."}
      primary_energy: {description: "Primary energy as defined in national statistics."}
      end_use_energy: {description: "Energy by end use (heating, cooling, lighting, ...)."}
      load_profile: {description: "Time series of demand."}
      peak_demand: {description: "Maximum demand over a period."}
      emissions: {description: "Greenhouse gas emissions."}
      expenditure: {description: "Energy cost."}

  MeteringLevel:
    description: "Finest level at which energy is measured or reported."
    permissible_values:
      area_aggregate: {description: "Totals over an area or sector."}
      utility_territory: {description: "Totals over a utility service territory or balancing authority."}
      whole_building: {description: "One value per building or property."}
      submeter_end_use: {description: "Submeters or end uses within a building."}
      circuit_or_appliance: {description: "Circuits or individual appliances."}

  MeasurementBasis:
    description: "How energy values were obtained."
    permissible_values:
      metered: {description: "Measured by meters at the stated resolution."}
      billed: {description: "From utility bills or supplier records."}
      self_reported: {description: "Reported by owners or respondents (for example through benchmarking software)."}
      modeled_or_estimated: {description: "Estimated by models, imputation or engineering calculation."}
      mixed: {description: "A combination of the above."}

  StockRepresentation:
    description: "How a simulated building stock is represented."
    permissible_values:
      sampled_models: {description: "A statistical sample of building models weighted to the stock."}
      building_by_building: {description: "One model per real building."}
      prototype_library: {description: "Typical or prototype buildings by type, vintage and climate."}

  ContextKind:
    description: "Kind of context or coupling data."
    permissible_values:
      grid_emissions: {description: "Emission factors of electricity supply."}
      energy_tariffs: {description: "Energy prices and tariffs."}
      land_use: {description: "Land use and zoning."}
      socio_economic: {description: "Population, income and housing statistics."}
      urban_climate_zones: {description: "Local climate zones and urban form classes."}

  ConventionType:
    description: "What a dataset convention concerns."
    permissible_values:
      missing_code: {description: "Codes that mean missing, not applicable, withheld or unknown."}
      unit: {description: "The unit and multiplier of values."}
      top_or_bottom_code: {description: "Codes that stand for ranges at the end of a scale."}
      imputation_flag: {description: "How imputation flags are named and linked to their variables."}
      weight: {description: "How weights are named and used."}
      identifier_format: {description: "How identifiers and keys are written."}
      do_not_use: {description: "A field the publisher says must not be used, or not for some purpose."}
      definition: {description: "What a field includes or excludes."}
