spatial_coverage:
  countries: [US]
  description: Commercial building stock of the contiguous United States, modeled with EnergyPlus and statistically
    sampled
unit_of_observation: building
spatial_granularity: county
temporal_coverage: {start: '2012', end: '2018'}
temporal_resolution: PT15M
update_frequency: 'periodic releases (OEDI folders 2021 to 2025: e.g. comstock_amy2018_release_1, release_2, release_3;
  comstock_amy2012_release_2)'
statistical_nature: simulation_synthetic
sampling_weights: Each simulated building model carries a sample weight (stock representation); exact column name
  not verified
record_count: null
record_count_note: Number of building models differs by release; not stated on the pages read
join_keys: [building_id, fips_county, building_type, vintage, climate_zone_ashrae, timestamp]
variables_documented: true
machine_readable: true
versioned: true
persistent_identifier: true
known_limitations: 'Simulated, not measured: archetype-based building models sampled to represent the stock and
  calibrated against aggregate measured data; building locations are not real addresses; releases differ in weather
  year (TMY3, AMY2012, AMY2018), model version and methodology, so results are not directly comparable across releases.
  Technical reports are not peer-reviewed journal papers.'
notes: Dataset DOI 10.25984/1876417 covers the whole EULP data lake (ComStock and ResStock). reference_paper_doi
  is the NREL technical report 'ComStock Reference Documentation' (DOI confirmed in Crossref); it is a DOE technical
  report, not a peer-reviewed article. Weather years 2012 and 2018 are inferred from release folder names (amy2012,
  amy2018); TMY3 versions exist for 2021 releases. Spatial granularity county and the weight column are assumed
  from the EULP data organization and were not verified on the pages read. Temporal resolution 15 minutes per the
  OEDI page.
