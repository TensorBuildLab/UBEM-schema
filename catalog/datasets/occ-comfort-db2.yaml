known_limitations: Compiled from heterogeneous contributed studies, so it is neither random nor representative of any building
  stock; skewed toward some regions and building types; subjective votes and measurements are at the occupant or room level,
  not building energy; metadata completeness varies by study; building-level coordinates are not provided on the Dryad page.
notes: The Dryad page says content is 'licensed for reuse' and does not name the license; CC0-1.0 is taken from the UBC Research
  Data mirror of Dryad version 9. The 2018 article itself carries a different (CC BY-NC-ND) license that applies to the paper
  only. Descriptor paper DOI verified in Crossref (authors Földváry Ličina et al.). Temporal range, country list, and join
  keys such as ASHRAE climate zone (a Köppen or climate field exists in the metadata per the paper, not re-verified) were
  not inspected in the files; join_keys are therefore tentative.
