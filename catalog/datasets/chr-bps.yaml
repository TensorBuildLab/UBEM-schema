known_limitations: Counts of authorized units from permit offices, not completed buildings; covers new privately-owned residential
  construction (the page does not describe non-residential coverage); no building-level records or addresses; sub-county place
  level is the finest geography; permits are not equal to starts or completions.
notes: Start year 1995 comes from the statement that historical state and MSA text files cover 1995 to 2019; place and county
  files may start earlier or later and were not checked. API availability is not mentioned on the page (api=false means not
  found). Role building_characteristics is limited to structure type and unit counts; the survey informs new-build additions
  to the stock rather than existing building characteristics. Valuation variables were not verified. Classified administrative_record
  because data are compiled from permit-office reports; BPS includes survey-based estimates for non-responding places that
  were not examined.
