notes: Chosen enum remote_sensing_derived because values are satellite-derived modeled estimates. nsrdb.nrel.gov
  and www.nrel.gov did not resolve from the fetch tool (NREL appears to have changed domain), so license, access
  details, resolution and years come from the verified descriptor paper plus search snippets (1998-2023, ~4 km,
  30 min) and should be re-checked. API needs a free key (general knowledge, unverified here).
