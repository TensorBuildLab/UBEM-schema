known_limitations: Cell values are subject to statistical confidentiality (suppression or perturbation on all grid levels
  per the statistical offices), so small 100 m cells are incomplete; counts, not building-level attributes; topics are limited
  to published tables; the Zensus 2022 combines register data, a full building and dwelling survey and household sample surveys.
notes: Spot-check 2026-11-13, the former zensus2022.de page redirects to destatis.de/zensus2022; the census combines registers, a full building and dwelling survey and household sample surveys, and census_complete refers to the building and dwelling count. Added to reduce U.S.-centric coverage. The release page states that the grid tables are free to use with attribution
  as Open Data, with each ZIP containing CSV files for the 10 km, 1 km and 100 m grids plus an XLSX dataset description; the
  explicit dl-de/by-2.0 wording was found for the boundary geodata only, so the license is recorded as the page wording. Heating-type
  tables ('Gebäude mit Wohnraum nach überwiegender Heizungsart') and building-year classes were confirmed via search result
  snippets, not by opening the files. Marked census_complete because the building and dwelling census (GWZ) is a full enumeration,
  but the overall design mixes register and sample elements. The 2011 census has a similar grid product (not examined).
