known_limitations: Gives only percent change in visits or duration relative to a baseline, for six broad place categories;
  it cannot represent absolute occupancy, building-level or POI-level visitation, schedules, or building-type-specific occupancy;
  covers only the pandemic period 2020-2022; the data are no longer updated and derive from opted-in Google location history
  users (not representative); small-area rows are suppressed or missing where privacy thresholds are not met; each use requires
  agreeing to Google's Terms of Service.
notes: 'Verified: the CSV header (country_region_code, country_region, sub_region_1, sub_region_2, metro_area, iso_3166_2_code,
  census_fips_code, place_id, date and six *_percent_change_from_baseline columns) and a Last-Modified date of 18 October
  2022 on the gstatic file, and Google''s archive notice (updates stopped 2022-10-15; all historical data remain public).
  The first rows of the file start on 2020-02-15; the global start date was inferred from that and not confirmed for all regions.
  The baseline definition and data-collection method were not re-read from the documentation. Included because it is the only
  open, national-to-global scale visitation signal found; no open building- or POI-level occupancy dataset at national scale
  was identified in this check. It is a context or boundary-condition proxy for occupancy trends, not a building input.'
