known_limitations: Consumption is calculated by the conventional DPE method (3CL), not metered; DPEs only exist for dwellings
  that were sold, rented or otherwise required to have one, so the stock is not covered uniformly; records can be duplicated
  or superseded; geocoding quality varies (score_ban and statut_geocodage columns); personal-address exposure is limited by
  publisher rules.
notes: 'Fields verified via the data-fair API schema (230 columns): BAN address and INSEE code, postal code, Lambert coordinates
  (coordonnee_cartographique_x/y_ban), _geopoint, type_batiment, periode_construction, surface fields, heating generator and
  envelope-quality fields, conso_5_usages_*. Hence building-level (address) granularity. Data dictionary is attached to the
  dataset page. The reform of 1 July 2021 changed the method; older DPEs are separate datasets (not checked).'
