notes: 'Answer to the Zhang et al. 2023 question: Nature Communications 14:2347 (10.1038/s41467-023-38079-3) does
  not release a new building dataset; its data availability statement points to Supplementary Data 1 and to this
  vectorized rooftop dataset for 90 cities at TPDC (DOI 10.11888/Geogra.tpdc.271702), plus code on Zenodo/GitHub.
  The descriptor is the 2022 Scientific Data paper, cited here, and the 2023 paper extrapolates rooftop area to
  354 cities (65,962 km2 in 2020, from search result). Dataset licence and whether TPDC download requires registration
  were not verified (TPDC page returned no content); the 2022 paper says the data are freely available for all users
  at TPDC, so access_level is open_download as stated by the paper, licence null.'
