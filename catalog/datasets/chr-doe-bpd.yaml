known_limitations: Not a statistically representative sample (LBNL says so explicitly); no raw or building-level records are
  released, only aggregates on groups of buildings large enough to prevent identification; data are annual only, not weather-normalized,
  with no pre/post-retrofit pairing; most buildings have location, type and energy use but few have systems or operational
  data.
notes: 'Status: no retirement notice was found; bpd.lbl.gov and bpd-info.lbl.gov returned HTTP 200 and the LBNL page is written
  in the present tense on 2026-11-12, and the DOE page lists an open-ended performance period from October 2011. Whether the
  API still responds was NOT tested. Because raw data are not released, the access level is open_api for aggregates only and
  this dataset cannot supply building-level inputs. License and API key requirements were not stated (null). spatial_granularity
  is ''none'' because individual locations are not released; the database stores city, state, ZIP and climate zone, and the
  allowed filters of the public tool were not enumerated. join_keys climate_zone_ashrae is inferred from ''climate zone''
  filter and not confirmed. No peer-reviewed descriptor paper was located.'
