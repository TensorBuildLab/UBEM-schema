  enum). Page gives no license or DOI. The Arguez 2012 BAMS paper (10.1175/BAMS-D-11-00197.1) describes the 1981-2010
  normals, so reference_paper_doi is null. Record count is not a single number (more than 15,000 precipitation stations).'
