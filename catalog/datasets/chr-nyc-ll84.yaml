notes: 'Spot-check 2026-11-13: this dataset holds report years 2022 onward (Socrata min/max query); 2010-2021 disclosures are in separate annual datasets. Fields inspected via the Socrata metadata API: report_year, property_id, nyc_borough_block_and_lot (BBL), nyc_building_identification
  (BIN), address_1, postal_code, borough, latitude, longitude, year_built, primary property type, site and weather-normalized
  EUI, ENERGY STAR score, electric distribution utility. Temporal start 2010 rests on the series of earlier annual datasets
  (calendar year 2010 onward) found via catalog.data.gov and mirror listings; the earlier per-year datasets were not individually
  opened. License is not stated in the dataset metadata; NYC Open Data terms of use apply, so license is null. NYC LL84 is
  included as a de facto reference city dataset per catalog criterion 3.'
