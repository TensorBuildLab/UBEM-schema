known_limitations: Prototypes represent code-minimum or code-compliant archetypes and are not measured buildings; they do
  not represent the existing stock; location set limited to 19 (commercial) and 18 (residential) climates; model inputs are
  tied to specific EnergyPlus versions; the manufactured housing set uses EnergyPlus 8.0.
notes: statistical_nature is simulation_synthetic (not standard_or_code) because the downloadable artifacts are executable
  EnergyPlus models plus their simulation outputs, built from ASHRAE 90.1 and IECC requirements; the underlying prescriptions
  are standard_or_code, which is why building_characteristics is the second role. Commercial and residential counts differ;
  record_count is the commercial number. License is not stated on the page (null). Temporal coverage lists the code editions
  covered (residential IECC 2006 to 2024; commercial ASHRAE 90.1 2013-2022 and IECC 2012-2021), not observation dates. The
  original 2011 PNNL/NREL prototype report was not retrieved, so no descriptor DOI is given. ComStock and ResStock belong
  to a different family.
