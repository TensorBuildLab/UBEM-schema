known_limitations: Irradiance comes from satellite (SARAH3, about 5 km) or reanalysis (ERA5, about 25 km) rather
  than ground measurement; years and database depend on location.
notes: Years/coverage from JRC search snippets for PVGIS 5.3 (SARAH3 and ERA5, 2005-2023); license/reuse terms not
  found (null). Reference paper is Huld et al. 2012, which describes an earlier PVGIS database (Europe/Africa),
  not 5.3. statistical_nature is the closest enum (satellite-derived, with reanalysis elsewhere). A PVGIS 6 report
  mentions 2014-2024 inputs; not verified.
