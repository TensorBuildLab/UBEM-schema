id: chr-uk-epc
title: 'Energy Performance of Buildings data: England and Wales (domestic EPCs, non-domestic EPCs, Display Energy Certificates)'
short_name: UK EPC (England and Wales)
publisher: Ministry of Housing, Communities and Local Government (MHCLG, formerly DLUHC)
landing_page: https://get-energy-performance-data.communities.gov.uk/
doi: null
