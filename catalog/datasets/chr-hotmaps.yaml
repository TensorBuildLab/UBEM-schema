known_limitations: Gross floor area and heat demand density maps are top-down estimates (statistical building stock data disaggregated
  to a 100 m grid using proxy data), not observed building data; residential and non-residential split relies on modeled allocation;
  the building-stock repository is at national (NUTS0) resolution; construction-period shares end in 2014.
notes: The GFA density map has reference year 2012 (gitlab page); construction periods run to 2014; scenario data to 2050
  exist in other repositories. License was not stated on the GitLab project pages or the wiki (the wiki text itself is CC
  BY 4.0, which is not the data license), so license is null; check each repository LICENSE file. The Energies 2019 article
  (CC BY 4.0) describes the GFA and heat demand method. Data file formats and the record count were not verified. 'building-stock'
  repo description mentions EU28 down to local level; the wiki states NUTS0 resolution. Reported role is building_characteristics
  although the heat demand density maps are modeled outputs.
