known_limitations: Simulated, not measured; calibrated to aggregate measured data; housing characteristics are sampled
  from distributions and dwellings are not real addresses; releases differ in weather year (TMY3, AMY2012, AMY2018),
  model and methodology versions. Reports are DOE technical reports, not peer-reviewed journal articles. Release
  2024.1 may use a different time resolution than the 2021 EULP releases (not verified).
notes: Dataset DOI 10.25984/1876417 covers the whole EULP data lake. reference_paper_doi is the NREL 'ResStock Dataset
  2024.1 Documentation' technical report (Crossref confirmed), not a peer-reviewed article. Temporal resolution
  15 minutes is stated by OEDI for the EULP data as a whole; the 2024.1 release was not checked individually. Spatial
  granularity and weights were not verified on the pages read.
