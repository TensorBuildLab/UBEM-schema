conventions:
- convention_type: missing_code
  applies_to: year built
  applies_to_variables:
  - yearbuilt
  rule: If the year built is empty or 0, the value is unknown.
  example: yearbuilt = 0 for a lot whose construction year is not recorded.
  missing_codes:
  - '0'
  - ''
- convention_type: missing_code
  applies_to: floor areas
  applies_to_variables:
  - bldgarea
  - resarea
  - comarea
  rule: Areas are in square feet; a value of zero means not available (if the lot has buildings) or not applicable (if
    it has none).
  example: bldgarea = 0 on a vacant lot.
  missing_codes:
  - '0'
  unit: unit:FT2
  unit_multiplier: 1
- convention_type: identifier_format
  applies_to: community district
  applies_to_variables:
  - cd
  rule: Three digits, the borough code followed by the community district number; codes 64, 26-28, 55-56, 80-84 and 95
    after the borough digit are joint interest areas (parks and airports), not community districts.
  example: cd = 101 is Manhattan Community District 1; 483 is JFK International Airport.
- convention_type: identifier_format
  applies_to: borough, block and lot (BBL)
  applies_to_variables:
  - bbl
  rule: Ten digits, the borough code followed by the five-digit block and the four-digit lot.
  example: bbl = 1008190014.
