known_limitations: Balancing-authority aggregate demand, not building level. Pseudo-ties and dynamic scheduling
  distort demand for some BAs; day-ahead forecasts not comparable to actual demand for some BAs; interchange reports
  often mismatch between neighbors; DST transition days are often misreported; generation totals cover only metered
  units; time zones vary by BA.
notes: Collection began 1 July 2015, but the API and interactive page serve data only from 1 January 2019; earlier
  data are in downloadable flat files (EIA about page). Subregion demand, generation by source and CO2 estimates
  begin 1 July 2018; battery storage appears as a source from 1 January 2025. The EIA Open Data API needs a free
  API key. Spatial granularity enum has no balancing-authority value, utility_service_territory is the nearest.
  Number of BAs not stated on the pages checked. Public domain per EIA Copyright and Reuse page.
