known_limitations: Aggregated meter-point records, not individual buildings; electricity not weather corrected,
  gas is weather corrected; gas year is mid-May to mid-May and non-half-hourly electricity covers February to January;
  domestic/non-domestic split uses profile classes (electricity) and a 73,200 kWh/year threshold (gas); unique non-standard
  gas sites excluded. Postcode-level data are Official Statistics (not accredited), and earlier postcode years are
  experimental.
notes: 'Added (non-U.S.). Record coverage 2013 to 2024 is the span stated for the summary reports and postcode data
  on the collection page; local-authority series are reported in some DESNZ publications from 2005, which was not
  verified here. join_keys uses fips_county only as a placeholder for area codes: no enum fits UK LSOA/MSOA codes,
  so postal_code and country_iso are the usable keys; this gap should be flagged for the schema. Spatial granularity
  postal_code reflects the finest public geography (domestic postcode level); the LSOA/MSOA level is the accredited
  product.'
