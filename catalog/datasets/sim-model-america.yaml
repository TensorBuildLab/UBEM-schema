notes: Access is open (free, Globus) but the ORNL page states no explicit license ('as is, no warranties'), so license
  is null. No peer-reviewed descriptor paper was verified for the dataset (AutoBEM papers are listed at a bit.ly
  link on the ORNL page, not resolved), so reference_paper_doi is null. Regional Zenodo extracts exist (e.g. 10.5281/zenodo.5154216,
  Los Angeles WRF extract) but were not catalogued. A related ORNL dataset DOI 10.57931/2349436 (Urban Parameters
  LA County 100m) is listed on the ORNL page; its relationship to Model America was not examined. Spatial granularity
  county is based on the file name state_county.zip. Simulation outputs (annual or hourly) are not part of the main
  package. Temporal coverage not stated.
