known_limitations: Public file uses disclosure avoidance; the guide lists which metropolitan areas are identified in the metropolitan
  PUF; no street-level or tract-level geography; for topical modules the correct weight depends on the instrument group.
notes: Spatial granularity is set to census_region_division because the 'Getting Started' guide says the PUF carries census
  region and division variables; the metropolitan PUF additionally identifies selected metropolitan areas (there is no enum
  value for CBSA). The exact list of metropolitan areas and the record count were not verified. Earlier PUF vintages exist
  (page lists years before 2019) but only the 2015 to 2023 series was checked. Weight names were taken from Census 'Getting
  Started with the PUF' guide as quoted in search results. Does not hold metered energy use.
