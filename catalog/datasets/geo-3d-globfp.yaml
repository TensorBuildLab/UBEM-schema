  per-part licence was not checked. The ESSD article cites older Zenodo IDs 11319912, 11397014 and 11391076 which
  now resolve to the records above. No single dataset DOI exists, so doi is null. A 2026 Handbook of Satellite Land
  Products chapter (10.1016/b978-0-443-21485-1.00127-8) summarizes the product.
