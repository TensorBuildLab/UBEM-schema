- building_type
variables_documented: true
machine_readable: true
versioned: true
persistent_identifier: false
known_limitations: State identifiers are on the public file (state_name has 51 values, 50 states plus DC) but EIA warns the
  sample was not designed for reliable state-level estimates for all variables; no sub-state geography except an urban type
  code (UATYP10); public file has no address; imputation flags (Z* variables) are included; estimates must use NWEIGHT and
  replicate weights; data collected late 2020 to early 2021 (pandemic period), which may affect occupancy-related variables.
notes: 'Energy consumption variables are derived from household energy-supplier billing data via EIA modeling, not metered
  by the survey. Public file: recs2020_public_v7 (Jan 2024; earlier versions Jul 2022 preliminary, Jun 2023 final). A 2024
  RECS is listed on EIA''s site but was not examined here. The 18,496 count was derived by reading the file and matches an
  independent third-party codebook; EIA page states only ''nearly 18,500''. BA_climate and IECC_climate_code variables are
  present in the file. The EIA descriptor paper does not exist, so reference_paper_doi is null.'
