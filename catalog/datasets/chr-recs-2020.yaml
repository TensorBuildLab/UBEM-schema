update_frequency: 'irregular, about every 4 to 5 years (survey years listed: 1993, 1997, 2001, 2005, 2009, 2015, 2020, 2024)'
statistical_nature: sample_survey_weighted
sampling_weights: NWEIGHT plus 60 jackknife replicate weights (NWEIGHT1-NWEIGHT60); confirmed in the public CSV header; EIA
  methodology brief states replicates were built with the Jackknife method
record_count: 18496
record_count_note: 18,496 household records counted directly in the v7 public CSV (EIA page says nearly 18,500 households);
  799 columns
