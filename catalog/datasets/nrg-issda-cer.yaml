  and personal data were removed; trial participants recruited for a time-of-use tariff and behaviour trial, so
  loads may include price response.
notes: Half-hourly resolution (PT30M) is inferred from a third-party R package description (time-of-day index 0
  to 47) because the ISSDA pages returned HTTP 403; confirm in the ISSDA manifest. Trial start July 2009 (benchmark
  period to 31 Dec 2009, active period 2010); recording for most meters begins about 14 July 2009 per the ISSDA
  FAQ (search snippet). The b2find DOI record labels the dataset open access but the rights note restricts supply
  to EEA and adequacy countries. A gas trial dataset (DOI 10.7929/ISSDA/JCYEZ3) exists separately.
